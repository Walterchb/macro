<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Indicadores económicos de Perú, Latinoamérica y el mundo, con series históricas y fuentes oficiales.">
  <meta name="color-scheme" content="light dark"><title>Información Económica · Treasury Hub</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="assets/vendor/fontawesome.css">
  <link rel="stylesheet" href="assets/treasury-core.css"><link rel="stylesheet" href="assets/macro.css"><link rel="stylesheet" href="assets/chart-engine.css"><link rel="stylesheet" href="assets/economic-views.css"><link rel="stylesheet" href="assets/macro-v3.css"><link rel="stylesheet" href="assets/economic-monitor.css"><link rel="stylesheet" href="assets/agenda.css"><link rel="stylesheet" href="assets/comparison-lab.css"><link rel="stylesheet" href="assets/macro-v4.css">
  <script defer src="assets/vendor/echarts.min.js"></script><script type="module" src="assets/app.js"></script>
</head>
<body>
  <a href="#content" class="skip">Ir al análisis</a>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="#peru"><div class="logo" aria-hidden="true">TH</div><div><strong>Información Económica</strong><p>Macro · Treasury Hub</p></div></a>
    <div class="actions top-actions">
      <button id="switch-app" class="icon-only" title="Herramientas Treasury Hub" aria-label="Herramientas Treasury Hub" aria-haspopup="dialog"><i class="fa-solid fa-layer-group" aria-hidden="true"></i></button>
      <button id="search-open" class="icon-only" title="Buscar series (Ctrl / ⌘ + K)" aria-label="Buscar series"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
      <button id="health" class="header-status" title="Ver fechas y calidad de las fuentes"><span class="dot" aria-hidden="true"></span><span id="health-label">Consultando</span></button>
      <button id="info" class="icon-only" title="Fuentes y metodología" aria-label="Fuentes y metodología"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></button>
      <button id="refresh" class="icon-only" title="Buscar una nueva versión de los datos" aria-label="Actualizar"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i></button>
      <button id="theme" class="icon-only" aria-label="Tema oscuro" title="Tema oscuro"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
      <button id="download" class="icon-only" aria-label="Descargar CSV de esta vista" title="Descargar datos de los gráficos de esta vista"><i class="fa-solid fa-download" aria-hidden="true"></i></button>
    </div>
  </div></header>
  <div class="workspace"><main id="main">
    <div class="analysis-toolbar-dock"><div class="analysis-toolbar">
      <div class="commandbar"><div><div class="period-controls">
        <button id="range-prev" aria-label="Reducir historia" title="Reducir historia"><i class="fa-solid fa-caret-left" aria-hidden="true"></i></button>
        <label for="range" class="sr-only">Historia</label><select id="range" title="Extensión del historial"><option value="3">Últimos 3 años</option><option value="5" selected>Últimos 5 años</option><option value="10">Últimos 10 años</option><option value="all">Todo el historial</option></select>
        <button id="range-next" aria-label="Ampliar historia" title="Ampliar historia"><i class="fa-solid fa-caret-right" aria-hidden="true"></i></button>
        <button id="range-all">Todo</button>
      </div></div></div>
      <nav id="navigation" class="section-nav" aria-label="Secciones del análisis"></nav>
    </div></div>
    <div id="content" tabindex="-1" aria-live="polite"><div class="loading">Consultando el archivo de indicadores…</div></div>
  </main></div>
  <footer class="site-footer"><div class="site-footer-inner"><div><strong>Macro · Treasury Hub</strong><span>Datos: BCRP, INEI y MEF vía BCRP, Banco Mundial y FRED.</span></div><div><span id="build-info"></span><button class="text-button" id="footer-info">Fechas, fuentes y metodología <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></button></div></div></footer>
  <dialog id="detail" aria-labelledby="detail-title"><div class="dialog-top"><h2 id="detail-title"></h2><button id="close-dialog" class="icon-only" aria-label="Cerrar"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div><div id="detail-body"></div></dialog>
  <div id="toast" role="status" hidden></div><noscript>Activa JavaScript para explorar los indicadores.</noscript>
</body></html>
