name: Sincronizar Treasury Macro Hub
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Descargar datos nuevos antes de publicar (más lento)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '35 12 * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: macro-production
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      revision: ${{ steps.ready.outputs.revision }}
      mode: ${{ steps.pages.outputs.mode }}
      page_url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detectar la publicación ya configurada
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            let site;
            try {
              ({data: site} = await github.rest.repos.getPages(context.repo));
            } catch (error) {
              if (error.status === 404) {
                throw new Error('Activa Pages en Settings → Pages: Deploy from a branch, main, /(root), o GitHub Actions. Este flujo respeta cualquiera de los dos modos.');
              }
              throw error;
            }
            const mode = site.build_type || (site.source ? 'legacy' : 'workflow');
            if (mode === 'legacy' && (site.source?.branch !== 'main' || site.source?.path !== '/')) {
              throw new Error('Pages publica otra ubicación. Usa main y /(root), o selecciona GitHub Actions.');
            }
            core.setOutput('mode', mode);
            core.setOutput('page_url', site.html_url);
            core.info(`Pages: ${mode}; ${site.html_url}`);
      - name: Actualizar fuentes (programación o solicitud expresa)
        if: github.event_name == 'schedule' || inputs.refresh == true
        run: python scripts/refresh_publication.py
      - name: Verificar datos y cálculos del snapshot
        run: |
          python scripts/validate_data.py
          python scripts/sync_agenda.py --validate
          python scripts/sync_regional.py --validate
          python scripts/sync_forecasts.py --validate
          python scripts/sync_demography.py --validate
          python -m unittest discover -s tests -p 'test_*.py'
          npm test
          node --check assets/app.js
      - name: Conservar datos nuevos en el repositorio
        if: github.event_name == 'schedule' || inputs.refresh == true
        run: |
          git add data/
          if ! git diff --cached --quiet; then
            git config user.name "macro-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Macro: actualizar indicadores, agenda y control de calidad"
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "::error::main cambió durante la descarga. Reejecutar sobre la nueva versión."
              exit 1
            fi
            git push origin HEAD:main
          fi
      - name: Preparar solo los archivos de la web
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.mode == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: dist
      - name: Confirmar la versión validada
        id: ready
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main cambió durante la validación. Reejecutar para publicar la versión actual."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-quality-${{ github.run_number }}
          path: |
            data/health.json
            data/revisions.json
            data/agenda.json
          retention-days: 30
  deploy:
    needs: sync
    if: needs.sync.outputs.ready == 'true' && needs.sync.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  deploy-root:
    needs: sync
    if: needs.sync.outputs.ready == 'true' && needs.sync.outputs.mode == 'legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ needs.sync.outputs.page_url }}
    steps:
      - name: Publicar main/root y comprobar el resultado
        uses: actions/github-script@v7
        env:
          EXPECTED_REVISION: ${{ needs.sync.outputs.revision }}
        with:
          script: |
            // GITHUB_TOKEN commits do not trigger branch Pages builds by themselves.
            await github.rest.repos.requestPagesBuild(context.repo);
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              let build;
              try {
                ({data: build} = await github.rest.repos.getLatestPagesBuild(context.repo));
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              if (build.commit !== process.env.EXPECTED_REVISION) continue;
              if (build.status === 'built') {
                core.info(`Publicación verificada: ${build.commit}`);
                return;
              }
              if (build.status === 'errored') {
                throw new Error(build.error?.message || 'GitHub Pages no pudo construir la web.');
              }
            }
            throw new Error('Pages no confirmó esta versión dentro de cinco minutos. Revisa pages-build-deployment antes de reejecutar.');
