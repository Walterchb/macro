name: Sincronizar Treasury Macro Hub
on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: macro-production
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Descargar y validar fuentes
        run: python scripts/sync_data.py
      - name: Verificar datos y cálculos
        run: |
          python scripts/validate_data.py
          python -m unittest discover -s tests -p 'test_*.py'
          npm test
          node --check dist/assets/app.js
      - name: Conservar datos en el repositorio
        run: |
          git add dist/data/
          if ! git diff --cached --quiet; then
            git config user.name "macro-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Macro: actualizar series oficiales y control de calidad"
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "::error::main cambió durante la descarga. Reejecutar sobre nueva versión."
              exit 1
            fi
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Listo para publicar
        id: ready
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-quality-${{ github.run_number }}
          path: |
            dist/data/health.json
            dist/data/revisions.json
          retention-days: 30
  deploy:
    needs: sync
    if: needs.sync.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
